<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Чертёж — Modul3D</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: #14171c; color: #d9dee7;
    font: 14px/1.3 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  body { display: flex; flex-direction: column; }
  .bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 8px 12px;
    background: #1d2128; border-bottom: 1px solid #2c323c; }
  .bar .name { flex: 1 1 200px; min-width: 120px; font-weight: 600; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap; }
  .bar button { background: #2a303a; color: inherit; border: 1px solid #3a4250; border-radius: 6px;
    padding: 6px 12px; font: inherit; cursor: pointer; }
  .bar button:hover { background: #343c49; }
  .bar .zoom { min-width: 52px; text-align: center; color: #9aa4b5; }
  .hint { color: #8791a3; font-size: 12px; }
  /* Область просмотра: прокручивается и колёсиком/полосами, и перетаскиванием. */
  .stage { flex: 1 1 auto; overflow: auto; display: flex; cursor: grab; touch-action: pan-x pan-y;
    overscroll-behavior: contain; }
  .stage.drag { cursor: grabbing; user-select: none; }
  /* margin:auto (а не центрирование через grid/justify) — иначе при увеличении
     левый/верхний край уходит в минус и до него не докрутить. */
  .stage img { display: block; margin: auto; flex: none; max-width: none; background: #fff;
    -webkit-user-drag: none; user-select: none; }
  .err { margin: 40px auto; max-width: 480px; text-align: center; color: #f0a0a0; }
</style>
</head>
<body>
<div class="bar">
  <div class="name" id="name">Чертёж</div>
  <button type="button" id="zOut" title="Уменьшить (клавиша −)">−</button>
  <span class="zoom" id="zVal">—</span>
  <button type="button" id="zIn" title="Увеличить (клавиша +)">+</button>
  <button type="button" id="zFit" title="Вся страница целиком (клавиша 0)">Вписать</button>
  <button type="button" id="zWidth" title="По ширине окна">По ширине</button>
  <button type="button" id="z100" title="Реальный размер картинки (клавиша 1)">100%</button>
  <span class="hint">колёсико — масштаб · перетаскивание — сдвиг · двойной клик — приблизить</span>
</div>
<div class="stage" id="stage"><div class="err" id="err" hidden></div></div>

<script>
(function () {
  var params = new URLSearchParams(location.search);
  var src = params.get('src') || '';
  var title = params.get('t') || '';
  var stage = document.getElementById('stage');
  var errBox = document.getElementById('err');
  var zVal = document.getElementById('zVal');

  // Только картинки из assets/drawings — произвольный адрес через ?src= не открываем.
  if (!/^assets\/drawings\/[A-Za-z0-9._-]+\.(png|jpe?g|webp)$/.test(src)) {
    errBox.hidden = false;
    errBox.textContent = 'Чертёж не найден: неверный адрес картинки.';
    return;
  }
  document.getElementById('name').textContent = title || src.split('/').pop();
  document.title = (title || 'Чертёж') + ' — Modul3D';

  var img = new Image();
  img.alt = title || 'Чертёж';
  var scale = 1, MIN = 0.05, MAX = 2;

  function clamp(v) { return Math.min(MAX, Math.max(MIN, v)); }
  function apply() {
    img.style.width = Math.round(img.naturalWidth * scale) + 'px';
    zVal.textContent = Math.round(scale * 100) + '%';
  }
  // Масштаб с сохранением точки под курсором (cx, cy — координаты окна).
  function zoomAt(next, cx, cy) {
    next = clamp(next);
    if (next === scale) return;
    var r = img.getBoundingClientRect();
    var px = (cx - r.left) / scale, py = (cy - r.top) / scale;
    scale = next;
    apply();
    var r2 = img.getBoundingClientRect();
    stage.scrollLeft += r2.left + px * scale - cx;
    stage.scrollTop += r2.top + py * scale - cy;
  }
  function center() {
    var s = stage.getBoundingClientRect();
    return { x: s.left + s.width / 2, y: s.top + s.height / 2 };
  }
  function fitWidth() { scale = clamp((stage.clientWidth - 2) / img.naturalWidth); apply(); stage.scrollLeft = 0; stage.scrollTop = 0; }
  function fitPage() {
    scale = clamp(Math.min((stage.clientWidth - 2) / img.naturalWidth, (stage.clientHeight - 2) / img.naturalHeight));
    apply(); stage.scrollLeft = 0; stage.scrollTop = 0;
  }
  function byStep(f) { var c = center(); zoomAt(scale * f, c.x, c.y); }

  img.onload = function () { stage.appendChild(img); fitWidth(); };
  img.onerror = function () { errBox.hidden = false; errBox.textContent = 'Не удалось загрузить чертёж.'; };
  img.src = src;

  document.getElementById('zIn').onclick = function () { byStep(1.4); };
  document.getElementById('zOut').onclick = function () { byStep(1 / 1.4); };
  document.getElementById('zFit').onclick = fitPage;
  document.getElementById('zWidth').onclick = fitWidth;
  document.getElementById('z100').onclick = function () { var c = center(); zoomAt(1, c.x, c.y); };

  stage.addEventListener('wheel', function (e) {
    e.preventDefault();
    var k = e.deltaMode === 1 ? 33 : 1;          // строки → пиксели
    var speed = e.ctrlKey ? 0.01 : 0.0018;       // щипок на тачпаде приходит с ctrlKey
    zoomAt(scale * Math.exp(-e.deltaY * k * speed), e.clientX, e.clientY);
  }, { passive: false });

  stage.addEventListener('dblclick', function (e) {
    zoomAt(scale < 0.9 ? 1 : fitWidthScale(), e.clientX, e.clientY);
  });
  function fitWidthScale() { return clamp((stage.clientWidth - 2) / img.naturalWidth); }

  // Перетаскивание мышью (на сенсорных экранах сдвиг делает сама прокрутка).
  var drag = null;
  stage.addEventListener('pointerdown', function (e) {
    if (e.pointerType === 'touch' || e.button !== 0) return;
    drag = { x: e.clientX, y: e.clientY, l: stage.scrollLeft, t: stage.scrollTop };
    stage.setPointerCapture(e.pointerId);
    stage.classList.add('drag');
  });
  stage.addEventListener('pointermove', function (e) {
    if (!drag) return;
    stage.scrollLeft = drag.l - (e.clientX - drag.x);
    stage.scrollTop = drag.t - (e.clientY - drag.y);
  });
  function endDrag() { drag = null; stage.classList.remove('drag'); }
  stage.addEventListener('pointerup', endDrag);
  stage.addEventListener('pointercancel', endDrag);

  // Щипок двумя пальцами.
  var pinch = null;
  function dist(t) { return Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY); }
  stage.addEventListener('touchstart', function (e) {
    if (e.touches.length === 2) pinch = { d: dist(e.touches), s: scale };
  }, { passive: true });
  stage.addEventListener('touchmove', function (e) {
    if (pinch && e.touches.length === 2) {
      e.preventDefault();
      var mx = (e.touches[0].clientX + e.touches[1].clientX) / 2;
      var my = (e.touches[0].clientY + e.touches[1].clientY) / 2;
      zoomAt(pinch.s * dist(e.touches) / pinch.d, mx, my);
    }
  }, { passive: false });
  stage.addEventListener('touchend', function (e) { if (e.touches.length < 2) pinch = null; }, { passive: true });

  document.addEventListener('keydown', function (e) {
    if (e.key === '+' || e.key === '=') byStep(1.4);
    else if (e.key === '-' || e.key === '_') byStep(1 / 1.4);
    else if (e.key === '0') fitPage();
    else if (e.key === '1') { var c = center(); zoomAt(1, c.x, c.y); }
  });
})();
</script>
</body>
</html>
