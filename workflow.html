<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Modul3D — Workflow</title>
<style>
  :root {
    --bg: #eef2f7;
    --accent: #0284c7;
    --accent-ink: #ffffff;
    --accent-soft: #e0f2fe;
    --accent-glow: rgba(2, 132, 199, .28);
    --bg-glow-opacity: .16;
    --grid-line: rgba(148, 163, 184, .16);
    --panel: #ffffff;
    --panel-glass: rgba(255, 255, 255, .72);
    --border: #e2e8f0;
    --text: #101317;
    --muted: #64748b;
    --done-bg: #f1f5f9;
    --danger: #ef4444;
    --shadow: 0 1px 2px rgba(16,19,23,0.04), 0 8px 24px rgba(16,19,23,0.06);
    --radius: 14px;
  }
  [data-theme="dark"] {
    --bg: #101317;
    --accent: #00c2ff;
    --accent-ink: #06131a;
    --accent-soft: #0b2733;
    --accent-glow: rgba(0, 194, 255, .40);
    --bg-glow-opacity: .22;
    --grid-line: rgba(255, 255, 255, .05);
    --panel: #171b21;
    --panel-glass: rgba(23, 27, 33, .72);
    --border: #262b33;
    --text: #e7ebf0;
    --muted: #8b96a5;
    --done-bg: #1b2028;
    --danger: #f87171;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px rgba(0,0,0,0.35);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    transition: background .25s ease, color .25s ease;
  }
  /* тонкая сетка-текстура фона, как на модуле .hero сайта modul3d.app */
  .page-grid {
    position: fixed;
    inset: 0;
    pointer-events: none;
    background-image:
      linear-gradient(var(--grid-line) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
    background-size: 48px 48px;
    -webkit-mask-image: radial-gradient(ellipse 80% 60% at 50% 0%, #000 40%, transparent 100%);
    mask-image: radial-gradient(ellipse 80% 60% at 50% 0%, #000 40%, transparent 100%);
  }
  /* фон точно как на сайте modul3d.app — голубые радиальные пятна на всю страницу */
  .page-bg {
    position: fixed;
    inset: 0;
    pointer-events: none;
    background:
      radial-gradient(760px circle at 12% 8%, var(--accent-glow), transparent 60%),
      radial-gradient(680px circle at 88% 28%, var(--accent-glow), transparent 55%),
      radial-gradient(820px circle at 50% 92%, var(--accent-glow), transparent 60%);
    opacity: var(--bg-glow-opacity);
    filter: blur(10px);
  }
  header {
    position: sticky;
    top: 0;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px 16px;
    padding: 14px 24px;
    background: var(--panel-glass);
    border-bottom: 1px solid var(--border);
    backdrop-filter: blur(10px) saturate(140%);
    -webkit-backdrop-filter: blur(10px) saturate(140%);
  }
  .head-left { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .brand { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
  .brand-mark { width: 24px; height: 24px; flex: none; display: block; align-self: center; }
  .brand-mark .bm-wire { fill: none; stroke: var(--accent); stroke-width: 3; stroke-linejoin: round; }
  .brand-mark .bm-fill { fill: var(--accent); opacity: .18; }
  .brand-name {
    font-size: 18px;
    font-weight: 800;
    letter-spacing: -0.01em;
    color: var(--text);
    white-space: nowrap;
  }
  .brand-name b { color: var(--accent); font-weight: 800; }
  .brand-page {
    font-size: 15px;
    font-weight: 500;
    color: var(--muted);
    white-space: nowrap;
  }
  .tabs {
    display: flex;
    gap: 20px;
  }
  .tab-btn {
    position: relative;
    border: none;
    background: transparent;
    color: var(--muted);
    font-family: inherit;
    font-size: 13.5px;
    font-weight: 500;
    padding: 8px 4px;
    cursor: pointer;
  }
  .tab-btn::after {
    content: '';
    position: absolute;
    left: 4px;
    right: 4px;
    bottom: 2px;
    height: 2px;
    background: var(--accent);
    border-radius: 2px;
    transform: scaleX(0);
    transform-origin: left;
    transition: transform .28s cubic-bezier(.22,.61,.36,1);
  }
  .tab-btn:hover { color: var(--text); }
  .tab-btn:hover::after { transform: scaleX(1); }
  .tab-btn.active { color: var(--text); }
  .tab-btn.active::after { transform: scaleX(1); }
  a.tab-btn { text-decoration: none; display: inline-block; }
  .controls { display: flex; align-items: center; gap: 10px; }
  .progress-pill {
    font-size: 12px;
    color: var(--muted);
    background: var(--accent-soft);
    padding: 6px 12px;
    border-radius: 999px;
    white-space: nowrap;
  }
  .icon-btn {
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    border-radius: 10px;
    width: 36px;
    height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-size: 16px;
  }
  .icon-btn:hover { border-color: var(--accent); }
  .back-btn {
    border: 1px solid var(--accent);
    background: var(--accent-soft);
    color: var(--text);
    border-radius: 10px;
    width: 36px;
    height: 36px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    text-decoration: none;
    cursor: pointer;
    flex: none;
  }
  .back-btn:hover { background: var(--accent); color: #fff; }
  main {
    padding: 24px 16px;
  }
  .board {
    display: grid;
    grid-template-columns: repeat(6, minmax(0, 1fr));
    gap: 16px;
    align-items: stretch;
  }
  @media (max-width: 1700px) {
    .board { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  }
  @media (max-width: 860px) {
    .board { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
  /* Узкий экран: логотип и кнопки в одном ряду (кнопки справа, «В программу» — крайняя),
     вкладки — вторым рядом на всю ширину */
  @media (max-width: 1000px) {
    header { flex-wrap: wrap; }
    .head-left { order: 1; }
    .controls { order: 2; margin-left: auto; flex: none; }
    .tabs { order: 3; flex-basis: 100%; }
  }
  @media (max-width: 560px) {
    .board { grid-template-columns: minmax(0, 1fr); }
    header { padding: 12px 12px; gap: 6px 8px; }
    .brand-page { display: none; }
    .tabs { gap: 12px; }
    .tab-btn { white-space: nowrap; font-size: 13px; }
    .controls { gap: 6px; }
    .brand-name { font-size: 16px; }
    .brand { gap: 6px; }
    .progress-pill { font-size: 10.5px; padding: 6px 7px; }
    .icon-btn { width: 34px; height: 34px; }
    .back-btn { width: 34px; height: 34px; }
  }
  @media (max-width: 340px) {
    .brand-name { display: none; }
  }
  .column {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
    height: calc(100vh - 170px);
  }
  .column-head {
    padding: 14px 16px 10px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    position: sticky;
    top: var(--header-h, 65px);
    z-index: 3;
    background: var(--panel);
    border-top-left-radius: var(--radius);
    border-top-right-radius: var(--radius);
  }
  .column-head .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    display: inline-block;
    margin-right: 8px;
    flex-shrink: 0;
  }
  .column-title {
    font-size: 14px;
    font-weight: 600;
    display: flex;
    align-items: center;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .count {
    font-size: 12px;
    color: var(--muted);
    background: var(--done-bg);
    border-radius: 999px;
    padding: 2px 8px;
    flex-shrink: 0;
  }
  .filter-row {
    display: flex;
    gap: 4px;
    padding: 8px 10px;
    border-bottom: 1px solid var(--border);
    flex-wrap: nowrap;
    overflow-x: auto;
    scrollbar-width: none;
    position: sticky;
    top: calc(var(--header-h, 65px) + var(--col-head-h, 43px));
    z-index: 2;
    background: var(--panel);
  }
  .filter-row::-webkit-scrollbar { display: none; }
  .filter-btn {
    flex: 0 0 auto;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    font-size: 10.5px;
    padding: 3px 7px;
    border-radius: 999px;
    cursor: pointer;
    white-space: nowrap;
  }
  .filter-btn:hover { border-color: var(--accent); color: var(--text); }
  .filter-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--accent-ink);
  }
  .cards {
    padding: 10px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    min-height: 0;
    flex: 1 1 auto;
    overflow-y: auto;
    scrollbar-width: thin;
    scrollbar-color: var(--muted) transparent;
  }
  .cards::-webkit-scrollbar { width: 7px; }
  .cards::-webkit-scrollbar-track { background: transparent; }
  .cards::-webkit-scrollbar-thumb {
    background: var(--border);
    border-radius: 999px;
  }
  .cards::-webkit-scrollbar-thumb:hover { background: var(--muted); }
  .card {
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 88px 12px 40px;
    font-size: 13.5px;
    line-height: 1.5;
    background: var(--bg);
    position: relative;
    min-height: 68px;
    flex-shrink: 0;
    transition: opacity .2s ease, border-color .2s ease, box-shadow .2s ease;
  }
  .card:hover { border-color: var(--accent); }
  .card.done {
    opacity: 0.55;
    background: var(--done-bg);
  }
  .card.done .card-text { text-decoration: line-through; }
  .card.in-progress {
    border-color: var(--accent);
    box-shadow: 0 0 0 2px var(--accent-glow);
  }
  .card-text {
    white-space: pre-wrap;
    cursor: pointer;
  }
  .checkbox {
    position: absolute;
    left: 12px;
    top: 12px;
    width: 18px;
    height: 18px;
    border-radius: 6px;
    border: 1.5px solid var(--muted);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    cursor: pointer;
  }
  .card.done .checkbox {
    background: var(--accent);
    border-color: var(--accent);
  }
  .checkbox svg { display: none; width: 12px; height: 12px; color: white; }
  .card.done .checkbox svg { display: block; }
  .progress-btn {
    position: absolute;
    left: 12px;
    top: 38px;
    width: 18px;
    height: 18px;
    border-radius: 6px;
    border: 1.5px solid var(--muted);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    cursor: pointer;
    color: var(--muted);
    font-size: 9px;
    line-height: 1;
  }
  .progress-btn:hover { border-color: var(--accent); color: var(--accent); }
  .card.in-progress .progress-btn {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--accent-ink);
  }
  .card.done .progress-btn { display: none; }
  .icon-mini {
    position: absolute;
    top: 10px;
    width: 22px;
    height: 22px;
    border: none;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    font-size: 12.5px;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .icon-mini:hover { color: var(--accent); background: var(--done-bg); }
  .icon-mini.copied { color: #22c55e; }
  .copy-icon { right: 62px; }
  .edit-icon { right: 35px; }
  .delete-icon { right: 8px; color: var(--danger); }
  .delete-icon:hover { color: #fff; background: var(--danger); }
  .empty-note {
    padding: 16px 12px;
    color: var(--muted);
    font-size: 13px;
    text-align: center;
  }
  .card.editing {
    padding: 10px;
    cursor: default;
  }
  .edit-textarea, .add-textarea {
    width: 100%;
    min-height: 64px;
    border: 1px solid var(--accent);
    border-radius: 8px;
    background: var(--panel);
    color: var(--text);
    font-family: inherit;
    font-size: 13.5px;
    padding: 8px;
    resize: vertical;
  }
  .edit-actions, .add-actions {
    display: flex;
    gap: 6px;
    margin-top: 8px;
    flex-wrap: wrap;
  }
  .btn {
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    font-size: 12px;
    padding: 6px 10px;
    border-radius: 8px;
    cursor: pointer;
  }
  .btn:hover { border-color: var(--accent); }
  .btn.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--accent-ink);
  }
  .btn.danger { color: var(--danger); border-color: var(--danger); background: transparent; }
  .btn.danger:hover { background: var(--danger); color: #fff; }
  .add-row { padding: 4px 10px 10px; }
  .add-btn {
    width: 100%;
    border: 1px dashed var(--border);
    background: transparent;
    color: var(--muted);
    padding: 10px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 13px;
    text-align: left;
  }
  .add-btn:hover { border-color: var(--accent); color: var(--accent); }
  .add-form { padding: 0 10px 10px; }

  .notes-wrap {
    max-width: 760px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .note-card {
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 88px 14px 16px;
    font-size: 14px;
    line-height: 1.55;
    background: var(--panel);
    box-shadow: var(--shadow);
    position: relative;
  }
  .note-card:hover { border-color: var(--accent); }
  .note-text { white-space: pre-wrap; cursor: pointer; }
  .note-meta { margin-top: 8px; font-size: 11.5px; color: var(--muted); }
  .note-card.editing { padding: 12px; cursor: default; }
  .notes-empty {
    padding: 30px 12px;
    color: var(--muted);
    font-size: 13.5px;
    text-align: center;
    border: 1px dashed var(--border);
    border-radius: 10px;
  }

  [data-locked] #board, [data-locked] #notesWrap { display: none !important; }
  .gate {
    max-width: 420px; margin: 40px auto; padding: 22px 20px;
    background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius, 14px);
    display: flex; flex-direction: column; gap: 12px;
  }
  .gate[hidden], .gate .gate-actions[hidden] { display: none; }
  .gate h2 { margin: 0; font-size: 17px; }
  .gate p { margin: 0; color: var(--muted); font-size: 13.5px; }
  .gate input {
    font: inherit; font-size: 15px; padding: 10px 12px; border-radius: 10px;
    border: 1px solid var(--border); background: transparent; color: var(--text);
  }
  .gate .gate-actions { display: flex; flex-wrap: wrap; gap: 8px; }
  .gate .gate-error { color: #e5484d; min-height: 1.2em; }
  .sync-line { margin-top: 4px; }
  .sync-line.error { color: #e5484d; }
  .link-btn { background: none; border: none; color: var(--muted); text-decoration: underline; cursor: pointer; font: inherit; padding: 0; }
  footer {
    text-align: center;
    color: var(--muted);
    font-size: 12px;
    padding: 24px;
  }
</style>
</head>
<body>

<div class="page-grid" aria-hidden="true"></div>
<div class="page-bg" aria-hidden="true"></div>

<header>
  <div class="head-left">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 64 64" aria-hidden="true">
        <path class="bm-wire" d="M32 12 52 22v20L32 52 12 42V22z"/>
        <path class="bm-wire" d="M12 22l20 10 20-10M32 32v20"/>
        <path class="bm-fill" d="M32 32 52 22v20L32 52z"/>
      </svg>
      <span class="brand-name">Modul<b>3D</b></span>
      <span class="brand-page">— Workflow</span>
    </div>
  </div>
  <div class="tabs">
    <a class="tab-btn" href="https://api.modul3d.app/admin/reviews.html" target="_blank" rel="noopener">Модерация отзывов</a>
    <button class="tab-btn" data-tab="board">Доска задач</button>
    <button class="tab-btn" data-tab="notes">Заметки</button>
  </div>
  <div class="controls">
    <span class="progress-pill" id="progress">0 / 0 выполнено</span>
    <button class="icon-btn" id="themeToggle" title="Переключить тему">🌙</button>
    <a class="back-btn" href="index.html" title="В программу" aria-label="Вернуться в программу"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 5l-7 7 7 7"/></svg></a>
  </div>
</header>

<main>
  <div class="gate" id="gate" hidden>
    <h2 id="gateTitle">Вход</h2>
    <p id="gateText">Доска и заметки хранятся на сервере и доступны только владельцу проекта.</p>
    <form id="loginForm" class="gate" style="margin:0;padding:0;border:0;background:none">
      <input type="email" id="loginEmail" placeholder="Email" autocomplete="username" required>
      <input type="password" id="loginPassword" placeholder="Пароль" autocomplete="current-password" required>
      <div class="gate-actions">
        <button class="btn primary" type="submit">Войти</button>
        <a class="btn" href="index.html" style="text-decoration:none">В программу</a>
      </div>
    </form>
    <div class="gate-actions" id="gateRetry" hidden>
      <button class="btn primary" type="button" id="retryBtn">Повторить</button>
      <button class="btn" type="button" id="localModeBtn" title="Работать с копией в этом браузере, без сервера">Открыть локальную копию</button>
    </div>
    <div class="gate-error" id="gateError"></div>
  </div>
  <div class="board" id="board"></div>
  <div class="notes-wrap" id="notesWrap" hidden></div>
</main>

<footer>Modul3D · доска задач и заметки (изначально собрано из Workflow.xlsx)
  <div class="sync-line" id="syncLine"></div>
</footer>

<script>
  const STORAGE_KEY = 'modul3d-workflow-data-v3';
  const OLD_KEY_V2 = 'modul3d-workflow-data-v2';
  const OLD_KEY_V1 = 'modul3d-workflow-done-v1';

  function uid() {
    return 't' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  }

  const defaultColumns = [
    {
      title: "Движок построения мебели",
      color: "#f97316",
      tasks: [
        "При редактировании угловой тумбы, добавлении новых фасадов, она редактируется неверно, открывание фасадов неправильное. Также удаляется заглушка.",
        "При нажатии модуля, который не разделён на отсеки, не работает. На боковой вкладке редактора отсеков не появляется вкладка «добавить технику»."
      ]
    },
    {
      title: "Интерфейс",
      color: "#a855f7",
      tasks: [
        "Не работают стрелки для изменения размеров."
      ]
    },
    {
      title: "Сайт",
      color: "#22c55e",
      tasks: [
        "Добавить иллюстрации с реального проекта.",
        "Добавить музыку на сайт.",
        "Когда нажимаем на кнопку «Запустить живую демонстрацию» на вкладке «Демо», запускается программа и появляются подсказки прямо в программе — куда нажимать и что делать поэтапно. Программа ведёт пользователя пошагово при создании мебели, чтобы он ознакомился с интерфейсом и понял возможности программы. Программа ведёт пользователя «за руку», как это реализовано в играх, особенно в стратегиях."
      ]
    },
    {
      title: "Монетизация",
      color: "#eab308",
      tasks: [
        "По окончанию работы с движком и демо-программы — запустить оплату через Paddle."
      ]
    },
    {
      title: "Продвижение",
      color: "#3b82f6",
      tasks: [
        "Рекламный ролик.",
        "Заставка. Раз, два, три. Опа!"
      ]
    },
    {
      title: "Работа с отзывами",
      color: "#ec4899",
      tasks: [
        "Создать агента, который будет читать отзывы на сайте, отвечать на вопросы посетителям и предлагать мне изменения, которые можно сделать в программе, основываясь на этих отзывах."
      ]
    }
  ];

  function buildDefaultState() {
    let oldDone = {};
    try { oldDone = JSON.parse(localStorage.getItem(OLD_KEY_V1) || '{}'); } catch (e) {}
    return {
      columns: defaultColumns.map((col, colIndex) => ({
        title: col.title,
        color: col.color,
        tasks: col.tasks.map((text, taskIndex) => ({
          id: uid(),
          text: text,
          done: !!oldDone[colIndex + '-' + taskIndex],
          inProgress: false
        }))
      })),
      notes: []
    };
  }

  function loadState() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        const parsed = JSON.parse(raw);
        if (parsed && Array.isArray(parsed.columns)) {
          if (!Array.isArray(parsed.notes)) parsed.notes = [];
          return parsed;
        }
      }
    } catch (e) {}
    try {
      const rawV2 = localStorage.getItem(OLD_KEY_V2);
      if (rawV2) {
        const parsedV2 = JSON.parse(rawV2);
        if (parsedV2 && Array.isArray(parsedV2.columns)) {
          return { columns: parsedV2.columns, notes: [] };
        }
      }
    } catch (e) {}
    return buildDefaultState();
  }

  // ----- Хранение на сервере (Railway): доска и заметки доступны только после
  // входа под аккаунтом владельца и лежат в базе в зашифрованном виде. В режиме
  // «локальная копия» (если сервер недоступен) всё как раньше — в localStorage.
  const API_BASE = 'https://modul3dmvp-production.up.railway.app';
  const TOKEN_KEY = 'modul3dAuthToken';
  const remote = { active: false, revision: 0 };
  let dirty = false, saving = false, saveTimer = null, retryTimer = null;

  function getToken() { try { return localStorage.getItem(TOKEN_KEY); } catch (e) { return null; } }

  async function api(method, path, body) {
    const token = getToken();
    let res;
    try {
      res = await fetch(API_BASE + path, {
        method,
        headers: Object.assign({ 'content-type': 'application/json' }, token ? { authorization: 'Bearer ' + token } : {}),
        body: body ? JSON.stringify(body) : undefined
      });
    } catch (e) { const err = new Error('network'); err.status = 0; throw err; }
    let json = null;
    try { json = await res.json(); } catch (e) {}
    if (!res.ok) { const err = new Error((json && json.error) || ('HTTP ' + res.status)); err.status = res.status; err.body = json; throw err; }
    return json;
  }

  const syncLine = document.getElementById('syncLine');
  function setSync(kind) {
    const map = { saved: 'Сохранено на сервере ✓', saving: 'Сохраняю…', error: 'Не удалось сохранить — повторю автоматически', local: 'Локальная копия в этом браузере (без сервера)', '': '' };
    syncLine.textContent = map[kind] || '';
    syncLine.className = 'sync-line' + (kind === 'error' ? ' error' : '');
    if (kind === 'saved' && localCopyExists()) {
      const b = document.createElement('button');
      b.className = 'link-btn'; b.type = 'button'; b.style.marginLeft = '10px';
      b.textContent = 'Стереть копию в этом браузере';
      b.addEventListener('click', () => {
        if (confirm('Стереть старую локальную копию заметок и доски в этом браузере? На сервере данные останутся.')) {
          try { localStorage.removeItem(STORAGE_KEY); localStorage.removeItem(OLD_KEY_V2); localStorage.removeItem(OLD_KEY_V1); } catch (e) {}
          setSync('saved');
        }
      });
      syncLine.appendChild(b);
    }
  }
  function localCopyExists() {
    try { return !!(localStorage.getItem(STORAGE_KEY) || localStorage.getItem(OLD_KEY_V2) || localStorage.getItem(OLD_KEY_V1)); } catch (e) { return false; }
  }

  function saveState() {
    if (!remote.active) {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
      return;
    }
    dirty = true;
    setSync('saving');
    clearTimeout(saveTimer);
    saveTimer = setTimeout(flushRemote, 600);
  }

  async function flushRemote() {
    if (saving || !dirty || !remote.active) return;
    saving = true; dirty = false;
    try {
      const r = await api('PUT', '/workflow', { data: state, revision: remote.revision });
      remote.revision = r.revision;
      if (!dirty) setSync('saved');
    } catch (e) {
      if (e.status === 409) {
        dirty = false;
        const mine = (state.notes || []).slice();
        await pullFromServer(false);
        // заметки, которые были только на этом экране, возвращаем к свежей версии
        const have = new Set(state.notes.map(n => n.text));
        let restored = 0;
        mine.forEach(n => { if (n && n.text && !have.has(n.text)) { state.notes.push(n); have.add(n.text); restored++; } });
        renderBoard(); if (activeTab === 'notes') renderNotes();
        if (restored) saveState(); else setSync('saved');
        alert('С другого устройства уже сохранялись более свежие данные — загружена свежая версия.' +
          (restored ? ' Ваши новые заметки (' + restored + ') добавлены к ней. Правки задач на этом экране могли не сохраниться, проверьте.' : ' Правки задач на этом экране могли не сохраниться, проверьте.'));
      } else if (e.status === 401 || e.status === 403) {
        remote.active = false;
        showGate('login', 'Сессия истекла — войдите снова.');
      } else {
        dirty = true; setSync('error');
        clearTimeout(retryTimer); retryTimer = setTimeout(flushRemote, 5000);
      }
    } finally {
      saving = false;
      if (dirty && !retryTimer) saveTimer = setTimeout(flushRemote, 300);
      retryTimer = null;
    }
  }

  async function pullFromServer(rerender) {
    const r = await api('GET', '/workflow');
    if (r.data) {
      state = r.data;
      if (!Array.isArray(state.notes)) state.notes = [];
    }
    remote.revision = r.revision;
    if (rerender) { renderBoard(); if (activeTab === 'notes') renderNotes(); setSync('saved'); }
  }

  const gate = document.getElementById('gate');
  function showGate(mode, message) {
    document.body.setAttribute('data-locked', '1');
    gate.hidden = false;
    const login = mode === 'login';
    document.getElementById('gateTitle').textContent = login ? 'Вход' : 'Не удалось подключиться';
    document.getElementById('loginForm').hidden = !login;
    document.getElementById('gateRetry').hidden = login;
    document.getElementById('gateError').textContent = message || '';
  }
  function hideGate() { document.body.removeAttribute('data-locked'); gate.hidden = true; }

  // Первый запуск после подключения сервера: что лежит в браузере, переносим на сервер
  // (а заметки, которых ещё нет на сервере, — добавляем к серверным).
  function readLocalState() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) { const p = JSON.parse(raw); if (p && Array.isArray(p.columns)) { if (!Array.isArray(p.notes)) p.notes = []; return p; } }
    } catch (e) {}
    return null;
  }

  async function bootstrap() {
    if (!getToken()) { showGate('login'); return; }
    let r;
    try { r = await api('GET', '/workflow'); }
    catch (e) {
      if (e.status === 401) { try { localStorage.removeItem(TOKEN_KEY); } catch (x) {} showGate('login', 'Войдите, чтобы открыть доску и заметки.'); return; }
      if (e.status === 403) { showGate('error', 'Этот аккаунт не является владельцем проекта.'); return; }
      showGate('error', e.status === 0 ? 'Нет связи с сервером.' : e.message);
      return;
    }
    const local = readLocalState();
    if (r.data) {
      state = r.data;
      if (!Array.isArray(state.notes)) state.notes = [];
      remote.revision = r.revision;
      remote.active = true;
      if (local && local.notes.length) {
        const have = new Set(state.notes.map(n => n.text));
        let added = 0;
        local.notes.forEach(n => { if (n && n.text && !have.has(n.text)) { state.notes.push({ id: uid(), text: n.text, createdAt: n.createdAt || Date.now() }); have.add(n.text); added++; } });
        if (added) saveState();
      }
    } else {
      // на сервере пусто — переносим то, что есть в браузере (или стартовую доску)
      state = local || state;
      remote.revision = 0;
      remote.active = true;
      dirty = true;
      await flushRemote();
    }
    hideGate();
    renderBoard();
    switchTab(activeTab);
    setSync('saved');
  }

  document.getElementById('loginForm').addEventListener('submit', async (ev) => {
    ev.preventDefault();
    const errBox = document.getElementById('gateError');
    errBox.textContent = '';
    try {
      const r = await api('POST', '/auth/login', {
        email: document.getElementById('loginEmail').value,
        password: document.getElementById('loginPassword').value
      });
      try { localStorage.setItem(TOKEN_KEY, r.token); } catch (e) {}
      document.getElementById('loginPassword').value = '';
      await bootstrap();
    } catch (e) { errBox.textContent = e.status === 401 ? 'Неверный email или пароль.' : (e.status === 0 ? 'Нет связи с сервером.' : e.message); }
  });
  document.getElementById('retryBtn').addEventListener('click', bootstrap);
  document.getElementById('localModeBtn').addEventListener('click', () => {
    remote.active = false;
    hideGate(); renderBoard(); switchTab(activeTab); setSync('local');
  });

  // Вернулись на вкладку — подтягиваем свежую версию с другого устройства
  // (если нет несохранённых правок и не открыта форма редактирования).
  document.addEventListener('visibilitychange', async () => {
    if (document.visibilityState === 'hidden') {
      if (dirty && remote.active) { try { fetch(API_BASE + '/workflow', { method: 'PUT', keepalive: true, headers: { 'content-type': 'application/json', authorization: 'Bearer ' + getToken() }, body: JSON.stringify({ data: state, revision: remote.revision }) }); } catch (e) {} }
      return;
    }
    if (!remote.active || dirty || saving || addingNote || editingNoteId || editing || Object.keys(adding).some(k => adding[k])) return;
    try {
      const r = await api('GET', '/workflow');
      if (r.data && r.revision !== remote.revision) { state = r.data; if (!Array.isArray(state.notes)) state.notes = []; remote.revision = r.revision; renderBoard(); if (activeTab === 'notes') renderNotes(); }
    } catch (e) {}
  });

  let state = loadState();

  // transient UI state (not persisted)
  const filters = {};    // colIndex -> 'all' | 'pending' | 'in-progress' | 'done'
  const adding = {};     // colIndex -> true while add-task form is open
  let editing = null;    // { colIndex, taskId } while a task card is in edit mode
  let addingNote = false;
  let editingNoteId = null;
  let activeTab = 'board';

  const board = document.getElementById('board');
  const notesWrap = document.getElementById('notesWrap');

  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;');
  }

  function copyText(text, btn) {
    const done = () => {
      const original = btn.innerHTML;
      btn.innerHTML = '✓';
      btn.classList.add('copied');
      setTimeout(() => { btn.innerHTML = original; btn.classList.remove('copied'); }, 1200);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done).catch(() => fallbackCopy(text, done));
    } else {
      fallbackCopy(text, done);
    }
  }

  function fallbackCopy(text, cb) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.left = '-9999px';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); } catch (e) {}
    document.body.removeChild(ta);
    if (cb) cb();
  }

  function switchTab(tab) {
    activeTab = tab;
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
    board.style.display = tab === 'board' ? 'grid' : 'none';
    notesWrap.style.display = tab === 'notes' ? 'flex' : 'none';
    if (tab === 'notes') renderNotes();
  }

  document.querySelectorAll('.tab-btn').forEach(b => {
    b.addEventListener('click', () => switchTab(b.dataset.tab));
  });

  function renderBoard() {
    board.innerHTML = '';
    let totalDone = 0, totalAll = 0;

    state.columns.forEach((col, colIndex) => {
      totalAll += col.tasks.length;
      totalDone += col.tasks.filter(t => t.done).length;

      const colEl = document.createElement('div');
      colEl.className = 'column';

      const doneCount = col.tasks.filter(t => t.done).length;
      const inProgressCount = col.tasks.filter(t => !t.done && !!t.inProgress).length;
      const pendingCount = col.tasks.filter(t => !t.done && !t.inProgress).length;

      const head = document.createElement('div');
      head.className = 'column-head';
      head.innerHTML = `
        <span class="column-title"><span class="dot" style="background:${col.color}"></span>${escapeHtml(col.title)}</span>
        <span class="count">${col.tasks.length}</span>
      `;
      colEl.appendChild(head);

      const filterRow = document.createElement('div');
      filterRow.className = 'filter-row';
      const currentFilter = filters[colIndex] || 'all';
      const filterDefs = [
        { key: 'all', label: 'Все', n: col.tasks.length },
        { key: 'pending', label: 'В ожидании', n: pendingCount },
        { key: 'in-progress', label: 'В работе', n: inProgressCount },
        { key: 'done', label: 'Готово', n: doneCount }
      ];
      filterDefs.forEach(f => {
        const btn = document.createElement('button');
        btn.className = 'filter-btn' + (currentFilter === f.key ? ' active' : '');
        btn.textContent = f.label + ' ' + f.n;
        btn.addEventListener('click', () => {
          filters[colIndex] = f.key;
          renderBoard();
        });
        filterRow.appendChild(btn);
      });
      colEl.appendChild(filterRow);

      const cardsEl = document.createElement('div');
      cardsEl.className = 'cards';

      const visibleTasks = col.tasks.filter(t => {
        if (currentFilter === 'pending') return !t.done && !t.inProgress;
        if (currentFilter === 'in-progress') return !t.done && !!t.inProgress;
        if (currentFilter === 'done') return t.done;
        return true;
      });

      if (visibleTasks.length === 0) {
        const empty = document.createElement('div');
        empty.className = 'empty-note';
        empty.textContent = col.tasks.length === 0 ? 'Нет задач' : 'Нет задач в этом фильтре';
        cardsEl.appendChild(empty);
      } else {
        visibleTasks.forEach(task => {
          const isEditing = editing && editing.colIndex === colIndex && editing.taskId === task.id;
          const card = document.createElement('div');
          card.className = 'card' + (task.done ? ' done' : '') + (!task.done && task.inProgress ? ' in-progress' : '') + (isEditing ? ' editing' : '');

          if (isEditing) {
            card.innerHTML = `
              <textarea class="edit-textarea">${escapeHtml(task.text)}</textarea>
              <div class="edit-actions">
                <button class="btn primary" data-action="save">Сохранить</button>
                <button class="btn" data-action="cancel">Отмена</button>
                <button class="btn danger" data-action="delete">Удалить</button>
              </div>
            `;
            const textarea = card.querySelector('.edit-textarea');
            card.querySelector('[data-action="save"]').addEventListener('click', () => {
              const val = textarea.value.trim();
              if (val) {
                task.text = val;
                saveState();
              }
              editing = null;
              renderBoard();
            });
            card.querySelector('[data-action="cancel"]').addEventListener('click', () => {
              editing = null;
              renderBoard();
            });
            card.querySelector('[data-action="delete"]').addEventListener('click', () => {
              col.tasks = col.tasks.filter(t => t.id !== task.id);
              editing = null;
              saveState();
              renderBoard();
            });
            textarea.addEventListener('keydown', (e) => {
              if (e.key === 'Escape') { editing = null; renderBoard(); }
              if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { card.querySelector('[data-action="save"]').click(); }
            });
            setTimeout(() => textarea.focus(), 0);
          } else {
            card.innerHTML = `
              <span class="checkbox"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M5 13l4 4L19 7"/></svg></span>
              <span class="progress-btn" title="${task.inProgress ? 'Снять пометку «в работе»' : 'Отметить как «в работе»'}">▶</span>
              <span class="card-text">${escapeHtml(task.text)}</span>
              <button class="icon-mini copy-icon" title="Копировать текст">⧉</button>
              <button class="icon-mini delete-icon" title="Удалить задачу">✕</button>
              <button class="icon-mini edit-icon" title="Редактировать">✎</button>
            `;
            card.querySelector('.checkbox').addEventListener('click', (e) => {
              e.stopPropagation();
              task.done = !task.done;
              if (task.done) task.inProgress = false;
              saveState();
              renderBoard();
            });
            card.querySelector('.progress-btn').addEventListener('click', (e) => {
              e.stopPropagation();
              if (task.done) return;
              task.inProgress = !task.inProgress;
              saveState();
              renderBoard();
            });
            card.querySelector('.copy-icon').addEventListener('click', (e) => {
              e.stopPropagation();
              copyText(task.text, e.currentTarget);
            });
            card.querySelector('.delete-icon').addEventListener('click', (e) => {
              e.stopPropagation();
              if (confirm('Удалить задачу?')) {
                col.tasks = col.tasks.filter(t => t.id !== task.id);
                if (editing && editing.colIndex === colIndex && editing.taskId === task.id) editing = null;
                saveState();
                renderBoard();
              }
            });
            const enterEdit = () => {
              editing = { colIndex, taskId: task.id };
              renderBoard();
            };
            card.querySelector('.edit-icon').addEventListener('click', (e) => {
              e.stopPropagation();
              enterEdit();
            });
            card.querySelector('.card-text').addEventListener('click', enterEdit);
          }

          cardsEl.appendChild(card);
        });
      }

      colEl.appendChild(cardsEl);

      const addRow = document.createElement('div');
      if (adding[colIndex]) {
        addRow.className = 'add-form';
        addRow.innerHTML = `
          <textarea class="add-textarea" placeholder="Текст новой задачи…"></textarea>
          <div class="add-actions">
            <button class="btn primary" data-action="add-save">Добавить</button>
            <button class="btn" data-action="add-cancel">Отмена</button>
          </div>
        `;
        const textarea = addRow.querySelector('.add-textarea');
        addRow.querySelector('[data-action="add-save"]').addEventListener('click', () => {
          const val = textarea.value.trim();
          if (val) {
            col.tasks.push({ id: uid(), text: val, done: false, inProgress: false });
            saveState();
          }
          adding[colIndex] = false;
          renderBoard();
        });
        addRow.querySelector('[data-action="add-cancel"]').addEventListener('click', () => {
          adding[colIndex] = false;
          renderBoard();
        });
        textarea.addEventListener('keydown', (e) => {
          if (e.key === 'Escape') { adding[colIndex] = false; renderBoard(); }
          if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { addRow.querySelector('[data-action="add-save"]').click(); }
        });
        setTimeout(() => textarea.focus(), 0);
      } else {
        addRow.className = 'add-row';
        addRow.innerHTML = `<button class="add-btn">+ Добавить задачу</button>`;
        addRow.querySelector('.add-btn').addEventListener('click', () => {
          adding[colIndex] = true;
          renderBoard();
        });
      }
      colEl.appendChild(addRow);

      board.appendChild(colEl);
    });

    document.getElementById('progress').textContent = totalDone + ' / ' + totalAll + ' выполнено';
    updateStickyOffsets();
  }

  function updateStickyOffsets() {
    const header = document.querySelector('header');
    if (header) {
      document.documentElement.style.setProperty('--header-h', header.getBoundingClientRect().height + 'px');
    }
    document.querySelectorAll('.column').forEach(col => {
      const colHead = col.querySelector('.column-head');
      if (colHead) {
        col.style.setProperty('--col-head-h', colHead.getBoundingClientRect().height + 'px');
      }
    });
  }
  window.addEventListener('resize', updateStickyOffsets);

  function formatDate(ts) {
    try { return new Date(ts).toLocaleString('ru-RU', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' }); }
    catch (e) { return ''; }
  }

  function renderNotes() {
    notesWrap.innerHTML = '';

    if (!state.notes.length && !addingNote) {
      const empty = document.createElement('div');
      empty.className = 'notes-empty';
      empty.textContent = 'Пока нет заметок';
      notesWrap.appendChild(empty);
    } else {
      state.notes.forEach(note => {
        const isEditing = editingNoteId === note.id;
        const card = document.createElement('div');
        card.className = 'note-card' + (isEditing ? ' editing' : '');

        if (isEditing) {
          card.innerHTML = `
            <textarea class="edit-textarea">${escapeHtml(note.text)}</textarea>
            <div class="edit-actions">
              <button class="btn primary" data-action="save">Сохранить</button>
              <button class="btn" data-action="cancel">Отмена</button>
              <button class="btn danger" data-action="delete">Удалить</button>
            </div>
          `;
          const textarea = card.querySelector('.edit-textarea');
          card.querySelector('[data-action="save"]').addEventListener('click', () => {
            const val = textarea.value.trim();
            if (val) {
              note.text = val;
              note.editedAt = Date.now();
              saveState();
            }
            editingNoteId = null;
            renderNotes();
          });
          card.querySelector('[data-action="cancel"]').addEventListener('click', () => {
            editingNoteId = null;
            renderNotes();
          });
          card.querySelector('[data-action="delete"]').addEventListener('click', () => {
            state.notes = state.notes.filter(n => n.id !== note.id);
            editingNoteId = null;
            saveState();
            renderNotes();
          });
          textarea.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') { editingNoteId = null; renderNotes(); }
            if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { card.querySelector('[data-action="save"]').click(); }
          });
          setTimeout(() => textarea.focus(), 0);
        } else {
          card.innerHTML = `
            <span class="note-text">${escapeHtml(note.text)}</span>
            <div class="note-meta">${formatDate(note.createdAt)}${note.editedAt ? ' · изменено ' + formatDate(note.editedAt) : ''}</div>
            <button class="icon-mini copy-icon" title="Копировать текст">⧉</button>
            <button class="icon-mini delete-icon" title="Удалить заметку">✕</button>
            <button class="icon-mini edit-icon" title="Редактировать">✎</button>
          `;
          card.querySelector('.copy-icon').addEventListener('click', (e) => {
            e.stopPropagation();
            copyText(note.text, e.currentTarget);
          });
          card.querySelector('.delete-icon').addEventListener('click', (e) => {
            e.stopPropagation();
            if (confirm('Удалить заметку?')) {
              state.notes = state.notes.filter(n => n.id !== note.id);
              if (editingNoteId === note.id) editingNoteId = null;
              saveState();
              renderNotes();
            }
          });
          const enterEdit = () => { editingNoteId = note.id; renderNotes(); };
          card.querySelector('.edit-icon').addEventListener('click', (e) => {
            e.stopPropagation();
            enterEdit();
          });
          card.querySelector('.note-text').addEventListener('click', enterEdit);
        }

        notesWrap.appendChild(card);
      });
    }

    const addRow = document.createElement('div');
    if (addingNote) {
      addRow.className = 'add-form';
      addRow.innerHTML = `
        <textarea class="add-textarea" placeholder="Текст новой заметки…"></textarea>
        <div class="add-actions">
          <button class="btn primary" data-action="add-save">Добавить</button>
          <button class="btn" data-action="add-cancel">Отмена</button>
        </div>
      `;
      const textarea = addRow.querySelector('.add-textarea');
      addRow.querySelector('[data-action="add-save"]').addEventListener('click', () => {
        const val = textarea.value.trim();
        if (val) {
          state.notes.push({ id: uid(), text: val, createdAt: Date.now() });
          saveState();
        }
        addingNote = false;
        renderNotes();
      });
      addRow.querySelector('[data-action="add-cancel"]').addEventListener('click', () => {
        addingNote = false;
        renderNotes();
      });
      textarea.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') { addingNote = false; renderNotes(); }
        if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { addRow.querySelector('[data-action="add-save"]').click(); }
      });
      setTimeout(() => textarea.focus(), 0);
    } else {
      addRow.className = 'add-row';
      addRow.innerHTML = `<button class="add-btn">+ Добавить заметку</button>
        <div class="edit-actions" style="margin-top:10px">
          <button class="btn" data-action="export-notes" title="Скачать заметки файлом на это устройство">Сохранить заметки в файл</button>
          <button class="btn" data-action="import-notes" title="Добавить заметки из ранее сохранённого файла">Загрузить из файла</button>
          <input type="file" accept="application/json,.json" hidden data-role="import-file">
        </div>`;
      addRow.querySelector('.add-btn').addEventListener('click', () => {
        addingNote = true;
        renderNotes();
      });
      addRow.querySelector('[data-action="export-notes"]').addEventListener('click', () => {
        if (!state.notes.length) { alert('Пока нет заметок для сохранения.'); return; }
        const blob = new Blob([JSON.stringify({ app: 'modul3d-workflow-notes', notes: state.notes }, null, 2)], { type: 'application/json' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'modul3d-notes.json';
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(a.href), 1000);
      });
      const fileInput = addRow.querySelector('[data-role="import-file"]');
      addRow.querySelector('[data-action="import-notes"]').addEventListener('click', () => fileInput.click());
      fileInput.addEventListener('change', () => {
        const f = fileInput.files && fileInput.files[0];
        if (!f) return;
        const reader = new FileReader();
        reader.onload = () => {
          try {
            const data = JSON.parse(reader.result);
            const incoming = Array.isArray(data) ? data : data.notes;
            if (!Array.isArray(incoming)) throw new Error('bad format');
            const have = new Set(state.notes.map(n => n.text));
            let added = 0;
            incoming.forEach(n => {
              if (n && typeof n.text === 'string' && n.text.trim() && !have.has(n.text)) {
                state.notes.push({ id: uid(), text: n.text, createdAt: n.createdAt || Date.now() });
                have.add(n.text); added++;
              }
            });
            saveState();
            renderNotes();
            alert('Добавлено заметок: ' + added);
          } catch (e) { alert('Не удалось прочитать файл заметок.'); }
        };
        reader.readAsText(f);
      });
    }
    notesWrap.appendChild(addRow);
  }

  document.body.setAttribute('data-locked', '1');
  bootstrap();

  // Theme handling
  const themeBtn = document.getElementById('themeToggle');
  function applyTheme(theme) {
    document.documentElement.setAttribute('data-theme', theme);
    themeBtn.textContent = theme === 'dark' ? '☀️' : '🌙';
  }
  let savedTheme = null;
  try { savedTheme = localStorage.getItem('modul3d-workflow-theme'); } catch(e) {}
  const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  applyTheme(savedTheme || (prefersDark ? 'dark' : 'light'));
  themeBtn.addEventListener('click', () => {
    const current = document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
    const next = current === 'dark' ? 'light' : 'dark';
    applyTheme(next);
    try { localStorage.setItem('modul3d-workflow-theme', next); } catch(e) {}
  });
</script>

</body>
</html>
